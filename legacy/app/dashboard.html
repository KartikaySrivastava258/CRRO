<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRRO — Revenue Recovery Command Center</title><style>body{margin:0;background:#f5f3ed;color:#10201b;font:14px Inter,system-ui}.wrap{max-width:1200px;margin:auto;padding:32px}.hero{background:#10201b;color:#fff;border-radius:18px;padding:30px}.k{color:#b9d7c3}.h{font-size:38px;max-width:760px;line-height:1.08}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #ddd8cb;border-radius:14px;padding:18px}.big{font-size:27px;font-weight:700}.muted{color:#706d63}.bar{height:9px;background:#e8e3d7;border-radius:8px}.fill{height:100%;background:#2d7055;border-radius:8px}.row{display:grid;grid-template-columns:220px 1fr 130px 110px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e2ddd0}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e2ddd0}button{background:#2d7055;color:#fff;border:0;padding:10px 15px;border-radius:9px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.h{font-size:30px}}</style></head><body><div class="wrap"><div class="hero"><div class="k">RAZORPAY BUILDATHON · TRACK 03</div><div class="h">CRRO turns failed payments into a constrained revenue-allocation problem.</div><p>Counterfactual uplift → portfolio optimization → deterministic guardrails → idempotent execution → measured incremental value.</p><button onclick="run()">Run recovery optimization</button></div><div id="app"><p>Loading...</p></div></div><script>async function run(){document.getElementById('app').innerHTML='<p>Running benchmark...</p>';let r=await fetch('/api/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});render(await r.json())}async function load(){render(await (await fetch('/api/report')).json())}function money(x){return '₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:0})}function render(r){let cr=r.policies.find(x=>x.policy==='CRRO')||{};let best=Math.max(...r.policies.map(x=>x.net_recovered_inr||0));document.getElementById('app').innerHTML='<div class="grid"><div class="card"><div class="muted">CRRO net recovered</div><div class="big">'+money(cr.net_recovered_inr)+'</div></div><div class="card"><div class="muted">Recovery rate</div><div class="big">'+(cr.recovery_rate*100).toFixed(1)+'%</div></div><div class="card"><div class="muted">Contact usage</div><div class="big">'+r.budget_usage.contacts_used.toLocaleString()+' / '+r.budget_usage.contacts_budget.toLocaleString()+'</div></div><div class="card"><div class="muted">Blocked by guardrails</div><div class="big">'+r.guardrails.blocked.toLocaleString()+'</div></div></div><div class="card"><h2>Policy benchmark</h2>'+r.policies.map(x=>'<div class="row"><b>'+x.policy+'</b><div class="bar"><div class="fill" style="width:'+Math.max(2,100*x.net_recovered_inr/best)+'%"></div></div><b>'+money(x.net_recovered_inr)+'</b><span>'+(x.actions_taken||0).toLocaleString()+' actions</span></div>').join('')+'</div><div class="card" style="margin-top:18px"><h2>Failure-reason performance</h2><table><tr><th>Reason</th><th>Cases</th><th>Recovery</th><th>Net value</th></tr>'+r.segments.map(s=>'<tr><td>'+s.failure_reason+'</td><td>'+s.n+'</td><td>'+(s.recovery_rate*100).toFixed(1)+'%</td><td>'+money(s.net_value_inr)+'</td></tr>').join('')+'</table></div>'}load()</script></body></html>
