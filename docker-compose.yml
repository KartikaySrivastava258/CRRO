services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crro
      POSTGRES_USER: crro
      POSTGRES_PASSWORD: crro
    volumes: [crro_pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U crro -d crro"],interval: 5s,timeout: 5s,retries: 10}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://crro:crro@db:5432/crro
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment: {BACKEND_URL: http://api:8000}
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  crro_pg:
